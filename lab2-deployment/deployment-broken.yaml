# Lab 2, the optional half — this manifest is deliberately wrong in FOUR places.
# Apply it, read the rejection, fix one thing, apply again. Repeat.
#
# It is the right application. That is the point — three of the four faults are
# things a team ships by accident, not things anyone would write on purpose.
#
# The platform team also uses this file: runbook step 9 applies it to prove the
# policies are actually being enforced before the session starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
      - name: orders-api
        image: docker.io/ptg/orders-api:latest
        ports:
        - containerPort: 8080
