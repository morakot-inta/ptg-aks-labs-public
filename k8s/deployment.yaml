# Lab 2 — a Deployment built to PTG's platform conventions.
#
# One line is yours to change: the image. Everything else is already what the
# platform team expects to see in production, and each of those lines is
# commented so you can see which convention it satisfies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      securityContext:                    # CONVENTION — containers run as non-root
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: orders-api
        # ⟵ YOUR LINE. Your registry, and the tag you pushed in Lab 1.
        #    Both values are on your card. Type them in — a $VARIABLE is not
        #    expanded inside a YAML file.
        image: <ACR>.azurecr.io/orders-api:<NAMESPACE>
        ports:
        - containerPort: 8080
        resources:                        # CONVENTION — requests and limits are always set
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:                    # CONVENTION — the cluster can ask whether
          httpGet:                        #             the container is alive
            path: /healthz
            port: 8080
        readinessProbe:                   #             and whether it is ready for traffic
          httpGet:
            path: /ready
            port: 8080
