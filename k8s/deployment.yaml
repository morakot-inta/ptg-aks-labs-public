apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      securityContext:                    # CONVENTION — containers run as non-root
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: orders-api
        image: <ACR>.azurecr.io/order-api:poc-v1
        ports:
        - containerPort: 8080
        resources:                        # CONVENTION — requests and limits are always set
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:                    # CONVENTION — the cluster can ask whether
          httpGet:                        #             the container is alive
            path: /healthz
            port: 8080
        readinessProbe:                   #             and whether it is ready for traffic
          httpGet:
            path: /ready
            port: 8080
