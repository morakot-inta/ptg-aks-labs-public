# Lab 3 — tells the CSI driver which vault and which secret to fetch.
#
# The driver runs on the node, not in your pod, and reads the vault as the
# identity the Key Vault add-on attached to the node pool. That is KV-CLIENT-ID
# on your card — a different identity from the CLIENT-ID you will use in Lab 4.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: orders-api-spc
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: <KV-CLIENT-ID>
    keyvaultName: <KEY-VAULT>
    tenantId: <TENANT-ID>
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
