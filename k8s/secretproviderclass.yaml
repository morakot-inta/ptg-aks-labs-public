apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: orders-api-spc
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: <CLIENT_ID>
    keyvaultName: <KEY-VAULT>
    tenantId: <TENANT-ID>
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
