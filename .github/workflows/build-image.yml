name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - sample-app/**
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - sample-app/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr.io requires a lowercase path: ghcr.io/<owner>/<repo>/orders-api
  IMAGE_NAME: ${{ github.repository }}/orders-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io with the built-in GITHUB_TOKEN, no PAT

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      # Pull requests build only, so a fork cannot push to the registry.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sample-app
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
